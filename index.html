<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONB Lite - Post Generator</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!-- html-to-image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <!-- Twemoji (replace native emoji with consistent images) -->
    <script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-dark: #1a0d12;
            --bg-deep: #2b1017;
            --panel-bg: rgba(54, 22, 31, 0.72);
            --panel-soft: rgba(255, 255, 255, 0.08);
            --brand-primary: #8b1e3f;
            --brand-secondary: #b71d4a;
            --brand-accent: #d9778b;
            --text-main: #fff7f8;
            --text-muted: #e7c7cf;
            --field-bg: rgba(28, 12, 17, 0.74);
            --field-border: rgba(255, 255, 255, 0.15);
            --shadow-soft: rgba(32, 7, 12, 0.38);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(217, 119, 139, 0.28), transparent 30%),
                radial-gradient(circle at bottom right, rgba(183, 29, 74, 0.22), transparent 35%),
                linear-gradient(135deg, var(--bg-dark), var(--bg-deep));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 1100px;
            width: 100%;
            background: linear-gradient(135deg, rgba(68, 23, 33, 0.82), rgba(34, 17, 22, 0.68));
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 1.25rem;
            box-shadow: 0 25px 60px -18px var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.18);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255,255,255,0.12), transparent 28%, rgba(255,255,255,0.04) 70%, transparent);
            pointer-events: none;
        }

        @media (min-width: 768px) {
            body {
                padding: 2rem;
            }

            .container {
                display: grid;
                grid-template-columns: 1fr 1.2fr;
                gap: 3rem;
                padding: 3rem;
            }
        }

        /* Controls Area */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header h1 {
            font-size: clamp(1.9rem, 4vw, 2.6rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ffdfe7, #f7b7c5 40%, #f4c9d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            background: var(--field-bg);
            border: 1px solid var(--field-border);
            border-radius: 16px;
            padding: 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.04);
        }

        textarea:focus {
            outline: none;
            border-color: rgba(255, 205, 214, 0.8);
            box-shadow: 0 0 0 3px rgba(184, 66, 96, 0.24);
        }

        input[type="file"] {
            background: var(--field-bg);
            border: 1px solid var(--field-border);
            border-radius: 16px;
            padding: 0.8rem 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.04);
        }

        input[type="file"]:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .generate-btn {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            color: #fff;
            border: 1px solid rgba(255,255,255,0.14);
            padding: 1rem 1.1rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            font-family: inherit;
            margin-top: 0.5rem;
            box-shadow: 0 12px 25px -10px rgba(139, 30, 63, 0.8);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 14px 30px -12px rgba(139, 30, 63, 0.9);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.04);
            color: #f9d2db;
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 0.65rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            align-self: center;
            margin-top: 0;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .preview-section {
            display: none;
            /* Hidden by default */
            align-items: center;
            justify-content: center;
            background: #e0e5ec;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            transition: padding 0.3s ease;
        }

        .preview-section.image-mode {
            padding: 0.5rem;
            /* Tighter padding for images */
        }

        @media (min-width: 768px) {
            .preview-section {
                padding: 2rem;
            }

            .preview-section.image-mode {
                padding: 1rem;
            }
        }

        .preview-section.active {
            display: flex;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .empty-state {
            display: none;
            /* completely removed empty state */
        }

        /* Generated Post Styling */
        .generated-post {
            width: 100%;
            max-width: 100%;
            height: auto;
            flex-shrink: 0;
            background: #e0e5ec;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: none;
            flex-direction: column;
            box-shadow: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.5);
            border: none;
        }

        .generated-post.active {
            display: flex;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .post-image-area {
            position: relative;
            width: 100%;
            flex-grow: 1;
            /* Take up remaining space below caption */
            background-color: #1e293b;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        .post-image-area video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #0f172a;
        }

        .cta-brand {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #8b1e3f, #b71d4a);
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 10;
            white-space: nowrap;
            box-shadow: 0 8px 20px rgba(94, 20, 35, 0.22);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .cta-brand .brand {
            font-weight: 700;
            font-size: 0.65rem;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .cta-brand .fb-icon {
            fill: #ffffff;
            width: 15px;
            height: 15px;
        }

        .cta-follow {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: #ffffff;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.28);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .post-caption-area {
            width: 100%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 1rem;
            position: relative;
            z-index: 2;
        }

        .generated-post.text-only-mode .post-caption-area {
            padding: 2rem;
            /* Clean space to prevent touching edges */
            margin: 0;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-grow: 1;
        }

        .post-caption-area .caption-text {
            font-family: "DM Sans", "SF Pro Display", "SF Pro Text", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", "EmojiOne Color", sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: #111827;
            line-height: 1.45;
            width: 100%;
            max-height: 100%;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: center;
            font-variant-emoji: emoji;
        }

        .generated-post.text-only-mode .post-caption-area .caption-text {
            text-align: center;
            padding: 0;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Controls Area -->
        <div class="controls-section">
            <div class="header">
                <h1>RONB Lite Generator</h1>
                <p>Create impactful, branded Facebook posts in seconds.</p>
            </div>

            <div class="input-group">
                <label for="postContent">Post Content</label>
                <textarea id="postContent" placeholder="Enter your breaking news or update here..."></textarea>
            </div>

            <div class="input-group">
                <label for="postImage">Background Photo or Video (Optional)</label>
                <input type="file" id="postImage" accept="image/*,video/*">
            </div>

            <div class="input-group"
                style="flex-direction: row; align-items: center; justify-content: flex-start; gap: 1.5rem; margin-bottom: 1.5rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="dragToggle" style="width: auto; cursor: pointer;">
                    <label for="dragToggle"
                        style="margin-bottom: 0; cursor: pointer; font-size: 0.9rem; font-weight: 500;">Enable drag</label>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="resizeToggle" style="width: auto; cursor: pointer;">
                    <label for="resizeToggle"
                        style="margin-bottom: 0; cursor: pointer; font-size: 0.9rem; font-weight: 500;">Enable resize</label>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn">Generate Post</button>
            <button class="download-btn" id="downloadBtn" style="display: none;">Download</button>
        </div>

        <!-- Preview Area -->
        <div class="preview-section" id="previewSection">
            <div class="generated-post" id="generatedPost">
                <div class="post-image-area" id="postImageArea"></div>
                <div class="post-caption-area">
                    <div class="cta-brand" id="ctaBrand">
                        <svg class="fb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path
                                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                        </svg>
                        <span class="brand">RONB Lite</span>
                    </div>
                    <div class="caption-text" id="renderText"></div>
                </div>
                <div class="cta-follow" id="ctaFollow">Follow Us</div>
            </div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const postContent = document.getElementById('postContent');
        const postImage = document.getElementById('postImage');

        const previewSection = document.getElementById('previewSection');
        const generatedPost = document.getElementById('generatedPost');
        const renderText = document.getElementById('renderText');
        const postImageArea = document.getElementById('postImageArea');
        const captionArea = document.querySelector('.post-caption-area');
        const ctaBrand = document.getElementById('ctaBrand');
        const ctaFollow = document.getElementById('ctaFollow');

        let currentVideoFrameDataUrl = '';

        function isVideoFile(file) {
            return !!file && file.type && file.type.startsWith('video/');
        }

        function captureVideoFrame(file) {
            return new Promise((resolve) => {
                if (!isVideoFile(file)) {
                    resolve('');
                    return;
                }

                const videoUrl = URL.createObjectURL(file);
                const video = document.createElement('video');
                video.src = videoUrl;
                video.muted = true;
                video.playsInline = true;
                video.preload = 'auto';
                video.crossOrigin = 'anonymous';

                video.addEventListener('loadeddata', () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth || 1280;
                        canvas.height = video.videoHeight || 720;
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        currentVideoFrameDataUrl = canvas.toDataURL('image/png');
                    } catch (error) {
                        currentVideoFrameDataUrl = '';
                    }
                    URL.revokeObjectURL(videoUrl);
                    resolve(currentVideoFrameDataUrl);
                }, { once: true });

                video.addEventListener('error', () => {
                    currentVideoFrameDataUrl = '';
                    URL.revokeObjectURL(videoUrl);
                    resolve('');
                }, { once: true });

                video.load();
            });
        }

        function setMediaPreview(file) {
            if (!file) {
                postImageArea.style.backgroundImage = '';
                postImageArea.innerHTML = '';
                return;
            }

            if (isVideoFile(file)) {
                postImageArea.innerHTML = '';
                postImageArea.style.backgroundImage = 'none';
                postImageArea.style.backgroundColor = '#0f172a';

                const video = document.createElement('video');
                const videoUrl = URL.createObjectURL(file);
                video.src = videoUrl;
                video.muted = true;
                video.loop = true;
                video.autoplay = true;
                video.playsInline = true;
                video.controls = false;
                video.style.position = 'absolute';
                video.style.inset = '0';
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'cover';
                video.style.display = 'block';
                postImageArea.appendChild(video);

                video.addEventListener('loadeddata', () => {
                    URL.revokeObjectURL(videoUrl);
                }, { once: true });

                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function() {
                    postImageArea.style.aspectRatio = `${this.width} / ${this.height}`;
                    postImageArea.style.backgroundImage = `url('${e.target.result}')`;
                    postImageArea.style.backgroundSize = 'cover';
                    postImageArea.style.backgroundPosition = 'center';
                    postImageArea.style.backgroundColor = '#1e293b';
                    postImageArea.innerHTML = '';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Replace emoji characters with Twemoji images inside a root element
        function parseEmojisInElement(root) {
            try {
                if (window.twemoji) {
                    window.twemoji.parse(root, { folder: 'svg', ext: '.svg' });
                }
            } catch (e) {
                console.warn('twemoji parse failed', e);
            }
        }

        // Inline externally loaded emoji images so html-to-image can capture them reliably
        async function inlineEmojiImages(root) {
            const imgs = Array.from(root.querySelectorAll('img'));
            for (const img of imgs) {
                const src = img.src || img.getAttribute('src');
                if (!src) continue;
                // Only inline images served by twemoji CDN or SVGs
                if (src.includes('twemoji') || src.endsWith('.svg') || src.endsWith('.png')) {
                    try {
                        const res = await fetch(src, { mode: 'cors' });
                        const blob = await res.blob();
                        const reader = new FileReader();
                        const dataUrl = await new Promise((resolve, reject) => {
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = reject;
                            reader.readAsDataURL(blob);
                        });
                        img.src = dataUrl;
                    } catch (err) {
                        // if inlining fails, keep original src
                        console.warn('Failed to inline emoji image', src, err);
                    }
                }
            }
        }

        generateBtn.addEventListener('click', async () => {
            const textValue = postContent.value.trim();
            const selectedFile = postImage.files && postImage.files.length > 0 ? postImage.files[0] : null;
            const hasImage = !!selectedFile && !isVideoFile(selectedFile);
            const hasVideo = isVideoFile(selectedFile);
            const hasMedia = !!selectedFile;

            if (!textValue && !hasMedia) {
                alert('Please enter some text or select an image or video to generate the post.');
                return;
            }

            currentVideoFrameDataUrl = '';
            if (hasVideo) {
                currentVideoFrameDataUrl = await captureVideoFrame(selectedFile);
            }

            // Reveal entire preview section and canvas
            previewSection.classList.add('active');

            // Re-trigger animation
            generatedPost.classList.remove('active');
            void generatedPost.offsetWidth; // trigger reflow
            generatedPost.classList.add('active');

            // Set text content
            renderText.textContent = textValue;

            // Parse emoji characters into Twemoji images in the caption area
            parseEmojisInElement(renderText);

            // Handle background image or fallback
            let isMobile = window.innerWidth <= 768;
            let baseSize = hasMedia ? (isMobile ? 0.7 : 0.9) : (isMobile ? 0.85 : 1.15);
            renderText.style.fontSize = baseSize + 'rem';

            const onlyImage = hasImage && !textValue;
            const onlyVideo = hasVideo && !textValue;
            const onlyText = !hasMedia && textValue;
            const imageAndText = hasImage && textValue;
            const videoAndText = hasVideo && textValue;

            if (onlyImage || onlyVideo) {
                generatedPost.classList.remove('text-only-mode');
                previewSection.classList.add('image-mode');
                generatedPost.style.aspectRatio = 'auto';
                generatedPost.style.background = '#e0e5ec';
                postImageArea.style.display = 'block';
                postImageArea.style.position = 'relative';
                postImageArea.style.height = 'auto';
                postImageArea.style.zIndex = '0';
                captionArea.style.display = 'block';
                captionArea.style.position = 'static';
                captionArea.style.padding = '0';
                captionArea.style.minHeight = '0';
                captionArea.style.height = '0';
                renderText.style.display = 'none';

                ctaBrand.style.top = 'auto';
                ctaBrand.style.bottom = '24px';
                ctaBrand.style.left = '50%';
                ctaBrand.style.right = 'auto';
                ctaBrand.style.transform = 'translateX(-50%)';

                ctaFollow.style.bottom = '6px';
                ctaFollow.style.left = '50%';
                ctaFollow.style.right = 'auto';
                ctaFollow.style.transform = 'translateX(-50%)';

                if (onlyVideo) {
                    setMediaPreview(selectedFile);
                } else {
                    setMediaPreview(selectedFile);
                }
            } else if (imageAndText || videoAndText) {
                generatedPost.classList.remove('text-only-mode');
                previewSection.classList.add('image-mode');
                generatedPost.style.aspectRatio = 'auto';
                generatedPost.style.background = '#e0e5ec';
                postImageArea.style.display = 'block';
                postImageArea.style.position = 'relative';
                postImageArea.style.height = 'auto';
                postImageArea.style.zIndex = '0';

                captionArea.style.display = 'flex';
                captionArea.style.position = 'relative';
                captionArea.style.zIndex = '1';
                captionArea.style.padding = '';
                captionArea.style.height = 'auto';
                captionArea.style.maxHeight = '40%';
                captionArea.style.minHeight = 'auto';
                captionArea.style.background = 'transparent';
                captionArea.style.borderLeft = 'none';
                renderText.style.display = 'block';
                renderText.style.color = '#111827';

                ctaBrand.style.top = '0';
                ctaBrand.style.bottom = 'auto';
                ctaBrand.style.left = '50%';
                ctaBrand.style.right = 'auto';
                ctaBrand.style.transform = 'translate(-50%, -50%)';

                ctaFollow.style.bottom = '6px';
                ctaFollow.style.left = '50%';
                ctaFollow.style.right = 'auto';
                ctaFollow.style.transform = 'translateX(-50%)';

                setMediaPreview(selectedFile);
            } else if (onlyText) {
                generatedPost.classList.add('text-only-mode');
                previewSection.classList.remove('image-mode');
                generatedPost.style.aspectRatio = '420 / 520';
                generatedPost.style.background = '#e0e5ec';
                
                postImageArea.style.display = 'block';
                postImageArea.style.position = 'absolute';
                postImageArea.style.top = '0';
                postImageArea.style.left = '0';
                postImageArea.style.width = '100%';
                postImageArea.style.height = '100%';
                postImageArea.style.zIndex = '0';
                postImageArea.style.backgroundImage = `url('./ronb.jpg')`;
                postImageArea.style.backgroundSize = 'cover';
                postImageArea.style.backgroundPosition = 'center';
                postImageArea.innerHTML = '<div style="position:absolute; inset:0; background: rgba(255, 255, 255, 0.96);"></div>';

                captionArea.style.display = 'flex';
                captionArea.style.position = 'relative';
                captionArea.style.zIndex = '1';
                captionArea.style.padding = '2rem 2rem 4rem 2rem';
                captionArea.style.margin = '0';
                captionArea.style.height = '100%';
                captionArea.style.minHeight = 'auto';
                captionArea.style.maxHeight = '100%';
                captionArea.style.background = 'transparent';
                captionArea.style.borderLeft = 'none';
                renderText.style.display = 'block';
                renderText.style.color = '#111827';

                ctaBrand.style.top = 'auto';
                ctaBrand.style.bottom = '24px';
                ctaBrand.style.left = '50%';
                ctaBrand.style.right = 'auto';
                ctaBrand.style.transform = 'translateX(-50%)';

                ctaFollow.style.bottom = '6px';
                ctaFollow.style.left = '50%';
                ctaFollow.style.right = 'auto';
                ctaFollow.style.transform = 'translateX(-50%)';
            }

            // Dynamically adjust font size
            setTimeout(() => {
                let currentSize = baseSize;
                const maxAllowedHeight = hasMedia ? (generatedPost.clientHeight * 0.4) : (captionArea.clientHeight - 40);
                while (renderText.scrollHeight > maxAllowedHeight && currentSize > 0.5) {
                    currentSize -= 0.05;
                    renderText.style.fontSize = currentSize + 'rem';
                }

                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.style.display = 'block';
            }, 0);
        });

        // Download functionality
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.addEventListener('click', async () => {
            const postElement = document.getElementById('generatedPost');
            const currentFile = postImage.files && postImage.files.length > 0 ? postImage.files[0] : null;
            const isExportVideo = isVideoFile(currentFile);

            const origRadius = postElement.style.borderRadius;
            const origShadow = postElement.style.boxShadow;
            const origAnimation = postElement.style.animation;

            if (isExportVideo && currentVideoFrameDataUrl) {
                const mediaNode = postImageArea.querySelector('video');
                if (mediaNode) {
                    mediaNode.style.display = 'none';
                }
                postImageArea.style.backgroundImage = `url('${currentVideoFrameDataUrl}')`;
                postImageArea.style.backgroundSize = 'cover';
                postImageArea.style.backgroundPosition = 'center';
                postImageArea.style.backgroundColor = '#0f172a';
            }

            postElement.style.borderRadius = '0px';
            postElement.style.boxShadow = 'none';
            postElement.style.animation = 'none';

            try {
                // Ensure twemoji images are parsed and inlined before capture
                parseEmojisInElement(postElement);
                await inlineEmojiImages(postElement);

                await htmlToImage.toPng(postElement, { pixelRatio: 1 });
                const dataUrl = await htmlToImage.toPng(postElement, {
                    pixelRatio: 4,
                    backgroundColor: '#e0e5ec',
                });

                if (isExportVideo && currentVideoFrameDataUrl) {
                    const mediaNode = postImageArea.querySelector('video');
                    if (mediaNode) {
                        mediaNode.style.display = 'block';
                    }
                    postImageArea.style.backgroundImage = 'none';
                }

                postElement.style.borderRadius = origRadius;
                postElement.style.boxShadow = origShadow;
                postElement.style.animation = origAnimation;

                const link = document.createElement('a');
                link.download = 'ronb-lite-post.png';
                link.href = dataUrl;
                link.click();
            } catch (error) {
                console.error('Oops, something went wrong!', error);
                if (isExportVideo && currentVideoFrameDataUrl) {
                    const mediaNode = postImageArea.querySelector('video');
                    if (mediaNode) {
                        mediaNode.style.display = 'block';
                    }
                    postImageArea.style.backgroundImage = 'none';
                }
                postElement.style.borderRadius = origRadius;
                postElement.style.boxShadow = origShadow;
                postElement.style.animation = origAnimation;
            }
        });

        // Drag and Drop Functionality
        const dragToggle = document.getElementById('dragToggle');
        const resizeToggle = document.getElementById('resizeToggle');

        let isDragging = false;
        let activeBadge = null;
        let startX, startY, initialX, initialY;

        function makeDraggable(element) {
            element.addEventListener('mousedown', dragStart);
            element.addEventListener('touchstart', dragStart, { passive: false });
            element.addEventListener('wheel', handleResize, { passive: false });
            element.dataset.scale = 1;
        }

        function handleResize(e) {
            if (!resizeToggle.checked) return;
            e.preventDefault();
            
            let scale = parseFloat(this.dataset.scale || 1);
            if (e.deltaY < 0) {
                scale += 0.05;
            } else {
                scale -= 0.05;
            }
            scale = Math.min(Math.max(0.3, scale), 4);
            this.dataset.scale = scale;
            
            if (this.style.transformOrigin !== 'top left') {
                const rect = this.getBoundingClientRect();
                const parentRect = generatedPost.getBoundingClientRect();
                this.style.bottom = 'auto';
                this.style.right = 'auto';
                this.style.margin = '0';
                this.style.left = (rect.left - parentRect.left) + 'px';
                this.style.top = (rect.top - parentRect.top) + 'px';
                this.style.transformOrigin = 'top left';
            }
            
            this.style.transform = `scale(${scale})`;
        }

        function dragStart(e) {
            if (!dragToggle.checked) return;

            activeBadge = this;
            isDragging = true;

            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }

            const rect = activeBadge.getBoundingClientRect();
            const parentRect = generatedPost.getBoundingClientRect();

            let offsetParent = activeBadge.offsetParent;
            let parentOffsetX = 0;
            let parentOffsetY = 0;
            if (offsetParent && offsetParent !== generatedPost) {
                const opRect = offsetParent.getBoundingClientRect();
                parentOffsetX = opRect.left - parentRect.left;
                parentOffsetY = opRect.top - parentRect.top;
            }

            initialX = (rect.left - parentRect.left) - parentOffsetX;
            initialY = (rect.top - parentRect.top) - parentOffsetY;

            activeBadge.style.bottom = 'auto';
            activeBadge.style.right = 'auto';
            activeBadge.style.transformOrigin = 'top left';
            activeBadge.style.transform = `scale(${activeBadge.dataset.scale || 1})`;
            activeBadge.style.margin = '0';
            activeBadge.style.left = initialX + 'px';
            activeBadge.style.top = initialY + 'px';

            activeBadge.style.cursor = 'grabbing';
            activeBadge.style.transition = 'none';
        }

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);

        function drag(e) {
            if (!isDragging || !activeBadge || !dragToggle.checked) return;

            e.preventDefault();

            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const dx = clientX - startX;
            const dy = clientY - startY;

            activeBadge.style.left = (initialX + dx) + 'px';
            activeBadge.style.top = (initialY + dy) + 'px';
        }

        function dragEnd() {
            if (activeBadge) {
                activeBadge.style.cursor = dragToggle.checked ? 'grab' : 'default';
            }
            isDragging = false;
            activeBadge = null;
        }

        makeDraggable(ctaBrand);
        makeDraggable(ctaFollow);

        dragToggle.addEventListener('change', () => {
            ctaBrand.style.cursor = dragToggle.checked ? 'grab' : 'default';
            ctaFollow.style.cursor = dragToggle.checked ? 'grab' : 'default';

            if (!dragToggle.checked) {
                // Reset positions to layout defaults by simulating a generation click
                if (renderText.textContent || (postImage.files && postImage.files.length > 0)) {
                    generateBtn.click();
                } else {
                    ctaBrand.style = '';
                    ctaFollow.style = '';
                }
            }
        });

        resizeToggle.addEventListener('change', () => {
            if (!resizeToggle.checked) {
                ctaBrand.dataset.scale = 1;
                ctaFollow.dataset.scale = 1;
                
                if (ctaBrand.style.transform.includes('scale')) {
                    ctaBrand.style.transform = 'scale(1)';
                }
                if (ctaFollow.style.transform.includes('scale')) {
                    ctaFollow.style.transform = 'scale(1)';
                }
            }
        });
    </script>
</body>
